<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf7f0">
<meta name="description" content="日本拉拉熊旅遊圖鑑。搜尋店舖、四尺玉與手作，從照片、附近車站和地圖開始排行程。">
<title>日本拉拉熊旅遊圖鑑</title>
<link rel="icon" href="./assets/compass.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/leaflet.css">
<link rel="stylesheet" href="./assets/style.css?v=3">
<script defer src="./assets/leaflet.js"></script>
<script defer src="./assets/data.js"></script>
<script defer src="./assets/photos.js"></script>
<script defer src="./assets/rail-grid.js"></script>
<script defer src="./assets/travel-details.js?v=3"></script>
<script defer src="./assets/catalog.js?v=3"></script>
<script defer src="./assets/map.js?v=3"></script>
<script defer src="./assets/app.js?v=3"></script>
</head>
<body>
<a class="skip" href="#search">跳到地點搜尋</a>
<header class="app-header">
 <a class="brand" href="./" aria-label="日本拉拉熊旅遊圖鑑首頁"><img src="./assets/compass.svg" alt="" width="37" height="37"><span><strong>日本拉拉熊旅遊圖鑑</strong><small>JAPAN TRAVEL ATLAS</small></span></a>
 <nav id="nav" class="main-nav" aria-label="旅遊功能">
  <button type="button" data-nav="explore" aria-current="page"><span data-icon="compass"></span>探索</button>
  <button type="button" data-nav="routes"><span data-icon="route"></span>行程</button>
  <button type="button" data-nav="calendar"><span data-icon="calendar"></span>活動</button>
  <button type="button" data-nav="photos"><span data-icon="image"></span>照片</button>
  <button type="button" data-nav="saved"><span data-icon="heart"></span>收藏<span id="saved-count" class="count"></span></button>
 </nav>
 <button class="about" id="about" type="button" aria-label="資料來源"><span data-icon="info"></span><span>資料來源</span></button>
</header>
<main class="workspace" id="workspace" data-mobile="list">
 <aside class="browse" aria-label="搜尋、照片與行程">
  <section class="browse-head" id="browse-head">
   <div class="app-kicker"><span data-icon="map"></span><span id="scope-label">日本全區</span></div>
   <h1 id="workspace-title">探索地點</h1>
   <div class="search-field" id="search-field"><span data-icon="search"></span><input type="search" id="search" placeholder="找店名、車站、四尺玉…" aria-label="搜尋地點" autocomplete="off"><button type="button" id="clear-search" aria-label="清空搜尋" hidden>×</button><kbd>/</kbd></div>
   <div id="explore-filters">
    <div class="filters"><label class="select-wrap"><span>地區</span><select id="region" aria-label="地區"></select></label><label class="select-wrap"><span>都道府縣</span><select id="pref" aria-label="都道府縣"></select></label></div>
    <div class="chips" id="chips" aria-label="地點分類"></div>
   </div>
   <label id="date-filter" class="date-filter" hidden>指定旅行日期<input id="day" type="date"></label>
   <div class="result-head"><span id="count" aria-live="polite"></span><button type="button" id="reset" hidden>清除篩選</button></div>
  </section>
  <section class="results" id="results" aria-label="搜尋結果" tabindex="0"></section>
 </aside>
 <section class="map-pane" id="map-pane" aria-label="地點與鐵路地圖">
  <div id="map" role="region" aria-label="日本互動地圖"></div>
  <div class="map-top">
   <label class="map-select"><span data-icon="pin"></span><select id="view" aria-label="地圖範圍"></select></label>
   <button type="button" id="this-area"><span data-icon="search"></span>搜尋此區域</button>
   <button type="button" id="layers-button" aria-expanded="false"><span data-icon="layers"></span>圖層</button>
  </div>
  <div class="layer-box" id="layer-box" hidden>
   <label>背景地圖<select id="base"><option value="pale">地理院淡色</option><option value="std">地理院標準</option><option value="photo">地理院航照</option><option value="osm">OpenStreetMap</option></select></label>
   <label><input id="layer-rail" type="checkbox" checked> 鐵路線</label><label><input id="layer-station" type="checkbox" checked> 車站</label><label><input id="layer-boundary" type="checkbox" checked> 都道府縣界</label>
   <label>篩選鐵路線<select id="line-filter"><option value="">全部線路</option></select></label>
  </div>
  <p class="map-status" id="map-status" aria-live="polite" hidden></p>
  <div class="map-card" id="map-card"></div>
 </section>
 <aside class="detail" id="detail" aria-label="地點詳細資料" hidden>
  <div class="detail-head"><span id="detail-label"></span><button id="close-detail" type="button" aria-label="關閉詳情"><span data-icon="close"></span></button></div>
  <div class="detail-content" id="detail-content"></div>
 </aside>
</main>
<div id="switcher" class="switcher" aria-label="手機檢視方式">
 <button type="button" data-mode="list" aria-pressed="true"><span data-icon="list"></span>清單</button>
 <button type="button" data-mode="map" aria-pressed="false"><span data-icon="map"></span>地圖</button>
</div>
<dialog id="photo-dialog" aria-labelledby="photo-title"><div class="light-head"><h2 id="photo-title">地點照片</h2><button id="close-photo" type="button" aria-label="關閉照片">×</button></div><div id="photo-content"></div></dialog>
<div class="status-toast" id="toast" role="status" hidden></div>
<noscript><p class="noscript">請啟用 JavaScript 使用搜尋、照片與地圖。</p></noscript>
</body>
</html>
